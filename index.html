<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- إجبار المتصفح على عدم حفظ النسخة القديمة -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Zajil Express Trading Company</title>
    <!-- مكتبة مسح الباركود للكاميرا -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- مكتبة قراءة كافة الباركودات بالصور -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- مكتبة تصدير ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #eef2f5; margin: 0; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-top: 8px solid #ffcc00; }
        
        button, input[type="file"] { margin: 10px 0; padding: 12px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #reader { width: 100%; margin-top: 15px; display: none; border: 2px dashed #003399; overflow: hidden; border-radius: 8px; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th { background: #003399 !important; color: #ffffff !important; padding: 10px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ألوان العناوين برقم اللون مباشرة -->
        <h2 style="color: #003399 !important; margin-bottom: 5px; font-weight: 800;">Zajil Express Trading Company</h2>
        <h2 style="color: #003399 !important; margin-top: 0; font-size: 18px;">Scan Barcode Shipment</h2>
    
    <!-- زر الكاميرا أزرق زاجل -->
    <button style="background: #003399 !important; color: white !important; border: none; width: 100%; font-weight: bold;" onclick="startCamera()">📷 تشغيل الكاميرا للتصوير</button>
    <div id="reader"></div>

    <hr>

    <!-- خيار رفع صورة -->
    <label for="qr-input-file"><b style="color: #003399;">أو اختر صورة من الجهاز:</b></label><br>
    <input type="file" id="qr-input-file" accept="image/*">

    <hr>

    <!-- قائمة الشحنات -->
    <h3 style="color: #003399;">قائمة الشحنات (<span id="count" style="color: #ffcc00; font-size: 22px;">0</span>)</h3>
    <table id="shipments-table">
        <thead>
            <tr>
                <th style="background: #003399; color: white;">#</th>
                <th style="background: #003399; color: white;">AWBNUMBER</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <br>
    <!-- زر تصدير Excel أصفر زاجل بكتابة كحلية -->
    <button style="background: #ffcc00 !important; color: #003399 !important; border: none; width: 100%; font-weight: bold;" onclick="exportToExcel()">📥 تحميل ملف Excel</button>
</div>

<script>
    let shipments = [];
    const html5QrCode = new Html5Qrcode("reader");

    // تصفية أرقام الجوال
    function isPhoneNumber(rawText) {
        if (!rawText) return true;
        const digitsOnly = rawText.trim().replace(/\D/g, '');

        if (digitsOnly.length === 10 && digitsOnly.startsWith('05')) return true;
        if ((digitsOnly.length === 12 || digitsOnly.length === 13 || digitsOnly.length === 14) && /^(9665|009665)/.test(digitsOnly)) return true;
        if (/(\+?9665|05\d{8})/i.test(rawText)) return true;

        return false;
    }

    // إضافة الشحنة للذاكرة
    function addShipmentCode(codeText) {
        const cleanText = codeText.trim();

        if (isPhoneNumber(cleanText)) {
            return false;
        }

        if (!shipments.includes(cleanText)) {
            shipments.push(cleanText);
            updateTable();
            return true;
        }
        return false;
    }

    // تحديث الجدول
    function updateTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        shipments.forEach((num, index) => {
            tbody.innerHTML += `<tr><td>${index + 1}</td><td>${num}</td></tr>`;
        });
        document.getElementById("count").innerText = shipments.length;
    }

    // تشغيل الكاميرا بإعدادات الدقة العالية
    function startCamera() {
        document.getElementById("reader").style.display = "block";
        
        const highResConfig = {
            fps: 15,
            qrbox: { width: 280, height: 160 },
            videoConstraints: {
                facingMode: { exact: "environment" },
                width: { min: 1280, ideal: 1920 },
                height: { min: 720, ideal: 1080 }
            }
        };

        html5QrCode.start(
            { facingMode: "environment" }, 
            highResConfig,
            (decodedText) => {
                if (addShipmentCode(decodedText)) {
                    alert("تم مسح رقم الشحنة بنجاح: " + decodedText);
                    html5QrCode.stop();
                    document.getElementById("reader").style.display = "none";
                }
            },
            (errorMessage) => {}
        ).catch(err => {
            // نمط احتياطي للأجهزة التي لا تدعم القيود المتقدمة
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    if (addShipmentCode(decodedText)) {
                        alert("تم مسح رقم الشحنة بنجاح: " + decodedText);
                        html5QrCode.stop();
                        document.getElementById("reader").style.display = "none";
                    }
                }
            );
        });
    }

    // قراءة من صورة مرفوعة
    document.getElementById('qr-input-file').addEventListener('change', async e => {
        if (e.target.files.length === 0) return;
        const imageFile = e.target.files[0];
        
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const imgElement = document.createElement('img');
        imgElement.src = URL.createObjectURL(imageFile);

        imgElement.onload = async () => {
            try {
                const results = await codeReader.decodeMultipleFromImageElement(imgElement);
                let addedAny = false;

                for (let result of results) {
                    if (addShipmentCode(result.text)) {
                        addedAny = true;
                    }
                }

                if (addedAny) {
                    alert("تم استخراج رقم الشحنة بنجاح من الصورة!");
                } else {
                    alert("لم يتم العثور على رقم شحنة جديد داخل الصورة.");
                }
            } catch (err) {
                try {
                    const result = await codeReader.decodeFromImageElement(imgElement);
                    if (addShipmentCode(result.text)) {
                        alert("تم مسح رقم الشحنة بنجاح: " + result.text);
                    } else {
                        alert("الباركود المقروء هو رقم جوال وتم استبعاده تلقائياً.");
                    }
                } catch (singleErr) {
                    alert("تعذر قراءة الباركود من الصورة، تأكد من وضوحها.");
                }
            }
        };
    });

    // تصدير ملف إكسل
    function exportToExcel() {
        if (shipments.length === 0) {
            alert("لا توجد شحنات لتصديرها!");
            return;
        }
        
        const data = shipments.map(num => ({ "AWBNUMBER": num }));
        const worksheet = XLSX.utils.json_to_sheet(data);
        worksheet['!cols'] = [{ wch: 25 }];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "SaleRent Details");
        XLSX.writeFile(workbook, "Shipments.xlsx");
    }
</script>

</body>
</html>
