<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <!-- مكتبات الماسح الضوئي والاستخراج والتصدير -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    /* شاشة الكاميرا للماسح الضوئي */
    .scanner-label {
      color: #003399;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      font-size: 0.95rem;
      text-align: center;
    }

    #reader {
      width: 100%;
      min-height: 230px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #003399;
      background-color: #000000;
      margin-bottom: 15px;
    }

    .file-btn {
      display: block;
      width: 100%;
      background-color: #fffdf2;
      color: #003399;
      border: 2px dashed #003399;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-align: center;
    }

    .status-msg {
      color: #003399;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: none;
      font-weight: bold;
      text-align: center;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 160px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <!-- الكاميرا / الماسح الضوئي المباشر -->
  <span class="scanner-label">📷 الماسح الضوئي لـ (AWBNUMBER)</span>
  <div id="reader"></div>

  <!-- اختيار صورة من المعرض -->
  <label class="file-btn">
    📁 اختيار صورة الشحنة من الملفات
    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processFileImage(event)">
  </label>

  <div id="status" class="status-msg">جاري معالجة الصورة...</div>

  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToCSV()">تصدير Excel (CSV)</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];
  let html5QrCode;

  // تشغيل الماسح الضوئي بالكاميرا فور فتح الصفحة
  window.onload = function() {
    if (typeof Html5Qrcode !== 'undefined') {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          // فحص واستبعاد أي رقم جوال فور قراءته من الكاميرا
          if (decodedText && isPureAWBNumber(decodedText)) {
            addShipment(decodedText);
          }
        },
        () => {}
      ).catch(err => {
        console.log("الكاميرا تحتاج إذن التفعيل");
      });
    }
  };

  // دالة فحص وتصفية أرقام الجوال نهائياً
  function isPureAWBNumber(str) {
    const cleanStr = str.trim().replace(/[\s\-\+]/g, '');
    
    // استبعاد أي رقم يبدأ بـ 05 أو 9665 أو طوله 10 أرقام ويبدأ بـ 05
    if (/^(05|9665)/.test(cleanStr)) {
      return false;
    }
    if (cleanStr.length === 10 && cleanStr.startsWith('05')) {
      return false;
    }
    return true;
  }

  // إضافة رقم الشحنة للقائمة فقط إذا كان صحيحاً وغير مكرر
  function addShipment(code) {
    const cleanCode = code.trim();
    if (cleanCode && !shipments.includes(cleanCode)) {
      shipments.push(cleanCode);
      updateUI();
    }
  }

  // معالجة اختيار الصور واستخراج رقم الشحنة فقط بدون رقم الجوال
  async function processFileImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.innerText = 'جاري تحليل الصورة والتقاط رقم الشحنة...';

    try {
      if (typeof Tesseract !== 'undefined') {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const numbersFound = ret.data.text.match(/\b\d{6,20}\b/g);
        let addedCount = 0;

        if (numbersFound) {
          numbersFound.forEach(num => {
            if (isPureAWBNumber(num)) {
              if (!shipments.includes(num)) {
                shipments.push(num);
                addedCount++;
              }
            }
          });
        }

        if (addedCount > 0) {
          statusEl.innerText = `تم استخراج ${addedCount} رقم شحنة بنجاح (تم استبعاد أرقام الجوال).`;
        } else {
          statusEl.innerText = 'لم يتم العثور على رقم شحنة صالح داخل الصورة.';
        }
        updateUI();
      }
    } catch (e) {
      statusEl.innerText = 'حدث خطأ أثناء قراءة الصورة.';
    }
  }

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToCSV() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,AWBNUMBER\n" + shipments.join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Shipments.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      document.getElementById('status').style.display = 'none';
      updateUI();
    }
  }
</script>

</body>
</html>
