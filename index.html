<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <!-- مكتبة مسح الباركود لقراءة الملفات والصور -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    .scanner-label {
      color: #003399;
      font-weight: bold;
      margin-bottom: 8px;
      display: block;
      font-size: 0.95rem;
      text-align: center;
    }

    #reader {
      width: 100%;
      min-height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #003399;
      background-color: #000000;
      margin-bottom: 15px;
    }

    .file-btn {
      display: block;
      width: 100%;
      background-color: #fffdf2;
      color: #003399;
      border: 2px dashed #003399;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-align: center;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 160px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <!-- الكاميرا والماسح الضوئي -->
  <span class="scanner-label">📷 الماسح الضوئي لـ (AWBNUMBER)</span>
  <div id="reader"></div>

  <!-- خيار رفع الصورة من جهازك (مأخوذ من كودك) -->
  <label class="file-btn">
    📁 اختيار صورة الشحنة من الجهاز
    <input type="file" id="qr-input-file" accept="image/*" style="display: none;">
  </label>

  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToCSV()">تصدير Excel (CSV)</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];
  const html5QrCode = new Html5Qrcode("reader");

  // تشغيل الكاميرا التلقائي للمسح المباشر
  window.onload = function() {
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        processAndAddCode(decodedText);
      },
      () => {}
    ).catch(err => {
      console.log("الكاميرا بانتظار إذن التفعيل");
    });
  };

  // دالة تصفية أرقام الجوال ومنع دخولها للقائمة
  function isPureAWB(codeStr) {
    const cleanNum = codeStr.trim().replace(/[\s\-\+]/g, '');
    
    // استبعاد أرقام الهواتف الجوالة (تبدأ بـ 05 أو 9665)
    if (/^(05|9665|009665)/.test(cleanNum)) {
      return false;
    }
    if (cleanNum.length === 10 && cleanNum.startsWith('05')) {
      return false;
    }
    return true;
  }

  // معالجة وإضافة الرقم الممسوح
  function processAndAddCode(code) {
    if (!isPureAWB(code)) {
      alert("هذا الرقم خاص برقم الجوال وتم استبعاده تلقائياً!");
      return;
    }

    if (!shipments.includes(code)) {
      shipments.push(code);
      updateUI();
    } else {
      alert("رقم الشحنة مسجل مسبقاً!");
    }
  }

  // طريقة رفع وقراءة الصورة من جهازك (طريقتك المطلوبة)
  document.getElementById('qr-input-file').addEventListener('change', e => {
    if (e.target.files.length == 0) return;
    const imageFile = e.target.files[0];
    
    html5QrCode.scanFile(imageFile, true)
      .then(decodedText => {
        processAndAddCode(decodedText);
      })
      .catch(err => {
        alert("تعذر قراءة الباركود من الصورة، تأكد من وضوح الصورة.");
      });
  });

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToCSV() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,AWBNUMBER\n" + shipments.join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Shipments.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      updateUI();
    }
  }
</script>

</body>
</html>
