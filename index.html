<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح باركود الشحنات</title>
    <!-- مكتبة مسح الباركود -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- مكتبة تصدير ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button, input[type="file"] { margin: 10px 0; padding: 10px 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; }
        .btn-main { background: #007bff; color: white; border: none; width: 100%; }
        .btn-excel { background: #28a745; color: white; border: none; width: 100%; }
        #reader { width: 100%; margin-top: 15px; display: none; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<!-- عنصر افتراضي لمسح الملفات دون التعارض مع الكاميرا -->
<div id="file-reader-temp" style="display:none;"></div>

<div class="card">
    <h2>ماسح باركود الشحنات 📦</h2>
    
    <!-- خيار التصوير المباشر -->
    <button class="btn-main" onclick="startCamera()">📷 تشغيل الكاميرا للتصوير</button>
    <div id="reader"></div>

    <hr>

    <!-- خيار رفع صورة من الجهاز -->
    <label for="qr-input-file"><b>أو اختر صورة من الجهاز:</b></label><br>
    <input type="file" id="qr-input-file" accept="image/*">

    <hr>

    <!-- قائمة الشحنات الممسوحة -->
    <h3>قائمة الشحنات (<span id="count">0</span>)</h3>
    <table id="shipments-table">
        <thead>
            <tr>
                <th>#</th>
                <th>رقم الشحنة</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <br>
    <!-- زر تصدير Excel -->
    <button class="btn-excel" onclick="exportToExcel()">📥 تحميل ملف Excel</button>
</div>

<script>
    let shipments = [];
    const html5QrCode = new Html5Qrcode("reader");

    // دالة الفحص والتأكد من أن النص الممسوح ليس رقم جوال
    function isPhoneNumber(rawText) {
        if (!rawText) return true;
        
        // استخراج الأرقام فقط لاستبعاد المسافات والرموز مثل +
        const digitsOnly = rawText.trim().replace(/\D/g, '');

        // 1. استبعاد أرقام الجوال المحلية (10 أرقام تبدأ بـ 05)
        if (digitsOnly.length === 10 && digitsOnly.startsWith('05')) return true;
        
        // 2. استبعاد أرقام الجوال الدولية (12-14 رقم تبدأ بـ 9665 أو 009665)
        if ((digitsOnly.length === 12 || digitsOnly.length === 13 || digitsOnly.length === 14) && /^(9665|009665)/.test(digitsOnly)) return true;

        // 3. استبعاد النصوص التي تحوي كلمات هاتف
        if (/(\+?9665|05\d{8})/i.test(rawText) || rawText.toLowerCase().includes('tel') || rawText.toLowerCase().includes('phone')) return true;

        return false;
    }

    // إضافة الرقم إلى القائمة عند النجاح (مع الفلترة)
    function onScanSuccess(decodedText) {
        const cleanText = decodedText.trim();

        // تصفية أرقام الجوال
        if (isPhoneNumber(cleanText)) {
            alert("⚠️ تم استبعاد هذا الباركود لأنه رقم جوال العميل وليس رقم الشحنة!");
            return;
        }

        if (!shipments.includes(cleanText)) {
            shipments.push(cleanText);
            updateTable();
            alert("تم مسح رقم الشحنة بنجاح: " + cleanText);
        } else {
            alert("هذا الرقم تم مسحه سابقاً!");
        }
    }

    // تحديث الجدول
    function updateTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        shipments.forEach((num, index) => {
            tbody.innerHTML += `<tr><td>${index + 1}</td><td>${num}</td></tr>`;
        });
        document.getElementById("count").innerText = shipments.length;
    }

    // تشغيل كاميرا الجوال/الجهاز
    function startCamera() {
        document.getElementById("reader").style.display = "block";
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                onScanSuccess(decodedText);
                html5QrCode.stop(); // إيقاف الكاميرا بعد القراءة
                document.getElementById("reader").style.display = "none";
            },
            (errorMessage) => { /* تجاهل الأخطاء أثناء البحث */ }
        );
    }

    // قراءة الباركود من ملف صورة مرفوع بواسطة عنصر محايد مستقل
    document.getElementById('qr-input-file').addEventListener('change', e => {
        if (e.target.files.length == 0) return;
        const imageFile = e.target.files[0];
        
        // استخدام كائن مستقل لرفع الصور لعدم التعارض مع الكاميرا
        const fileScanner = new Html5Qrcode("file-reader-temp");

        fileScanner.scanFile(imageFile, true)
            .then(decodedText => {
                onScanSuccess(decodedText);
            })
            .catch(err => {
                alert("تعذر قراءة الباركود من الصورة، تأكد من وضوح الصورة وتوجيهها على باركود الشحنة.");
            });
    });

    // تصدير البيانات إلى ملف Excel (.xlsx)
    function exportToExcel() {
        if (shipments.length === 0) {
            alert("لا توجد شحنات لتصديرها!");
            return;
        }
        
        const data = shipments.map((num, idx) => ({ "م": idx + 1, "رقم الشحنة": num }));
        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "الشحنات");
        
        XLSX.writeFile(workbook, "قائمة_الشحنات.xlsx");
    }
</script>

</body>
</html>
