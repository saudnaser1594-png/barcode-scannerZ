<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح باركود الشحنات</title>
    <!-- مكتبة مسح الباركود للكاميرا -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- مكتبة قراءة الباركودات المتعددة من الصور (حل مشكلة رفع الصورة) -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <!-- مكتبة تصدير ملفات Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #f4f6f9; margin: 0; padding: 20px; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button, input[type="file"] { margin: 10px 0; padding: 10px 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; cursor: pointer; }
        .btn-main { background: #007bff; color: white; border: none; width: 100%; }
        .btn-excel { background: #28a745; color: white; border: none; width: 100%; }
        #reader { width: 100%; margin-top: 15px; display: none; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>

<div class="card">
    <h2>ماسح باركود الشحنات 📦</h2>
    
    <!-- خيار التصوير المباشر -->
    <button class="btn-main" onclick="startCamera()">📷 تشغيل الكاميرا للتصوير</button>
    <div id="reader"></div>

    <hr>

    <!-- خيار رفع صورة من الجهاز -->
    <label for="qr-input-file"><b>أو اختر صورة من الجهاز:</b></label><br>
    <input type="file" id="qr-input-file" accept="image/*">

    <hr>

    <!-- قائمة الشحنات الممسوحة -->
    <h3>قائمة الشحنات (<span id="count">0</span>)</h3>
    <table id="shipments-table">
        <thead>
            <tr>
                <th>#</th>
                <th>رقم الشحنة</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>

    <br>
    <!-- زر تصدير Excel -->
    <button class="btn-excel" onclick="exportToExcel()">📥 تحميل ملف Excel</button>
</div>

<script>
    let shipments = [];
    const html5QrCode = new Html5Qrcode("reader");

    // فحص صارم لاستبعاد أي رقم جوال سعودي (05xxxxxxxx أو 9665xxxxxxxx)
    function isPhoneNumber(rawText) {
        if (!rawText) return true;
        const digitsOnly = rawText.trim().replace(/\D/g, '');

        if (digitsOnly.length === 10 && digitsOnly.startsWith('05')) return true;
        if ((digitsOnly.length === 12 || digitsOnly.length === 13 || digitsOnly.length === 14) && /^(9665|009665)/.test(digitsOnly)) return true;
        if (/(\+?9665|05\d{8})/i.test(rawText)) return true;

        return false;
    }

    // دالة إدراج رقم الشحنة
    function addShipmentCode(codeText) {
        const cleanText = codeText.trim();

        // تجارب استبعاد رقم الجوال
        if (isPhoneNumber(cleanText)) {
            return false;
        }

        if (!shipments.includes(cleanText)) {
            shipments.push(cleanText);
            updateTable();
            return true;
        }
        return false;
    }

    // تحديث الجدول
    function updateTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        shipments.forEach((num, index) => {
            tbody.innerHTML += `<tr><td>${index + 1}</td><td>${num}</td></tr>`;
        });
        document.getElementById("count").innerText = shipments.length;
    }

    // تشغيل كاميرا الجوال
    function startCamera() {
        document.getElementById("reader").style.display = "block";
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 150 } },
            (decodedText) => {
                if (addShipmentCode(decodedText)) {
                    alert("تم مسح رقم الشحنة بنجاح: " + decodedText);
                    html5QrCode.stop();
                    document.getElementById("reader").style.display = "none";
                }
            },
            (errorMessage) => {}
        );
    }

    // قراءة الصورة المرفوعة وفحص كافة الباركودات الموجودة فيها للوصول لرقم الشحنة
    document.getElementById('qr-input-file').addEventListener('change', async e => {
        if (e.target.files.length === 0) return;
        const imageFile = e.target.files[0];
        
        const codeReader = new ZXing.BrowserMultiFormatReader();
        const imgElement = document.createElement('img');
        imgElement.src = URL.createObjectURL(imageFile);

        imgElement.onload = async () => {
            try {
                // قراءة كل الباركودات الموجودة بالصورة دفعة واحدة
                const results = await codeReader.decodeMultipleFromImageElement(imgElement);
                let addedAny = false;

                for (let result of results) {
                    if (addShipmentCode(result.text)) {
                        addedAny = true;
                    }
                }

                if (addedAny) {
                    alert("تم التقاط رقم الشحنة بنجاح واستبعاد الجوال!");
                } else {
                    alert("لم يتم العثور على رقم شحنة جديد داخل الصورة (إما رقم جوال أو مكرر).");
                }
            } catch (err) {
                // في حال فشل decodeMultiple، تجربة المسح العادي
                try {
                    const result = await codeReader.decodeFromImageElement(imgElement);
                    if (addShipmentCode(result.text)) {
                        alert("تم مسح رقم الشحنة بنجاح: " + result.text);
                    } else {
                        alert("الباركود المقروء هو رقم جوال وتم استبعاده.");
                    }
                } catch (singleErr) {
                    alert("تعذر قراءة الباركود من الصورة، تأكد من وضوح الصورة.");
                }
            }
        };
    });

    // تصدير البيانات إلى Excel
    function exportToExcel() {
        if (shipments.length === 0) {
            alert("لا توجد شحنات لتصديرها!");
            return;
        }
        
        const data = shipments.map((num, idx) => ({ "م": idx + 1, "رقم الشحنة": num }));
        const worksheet = XLSX.utils.json_to_sheet(data);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "الشحنات");
        
        XLSX.writeFile(workbook, "قائمة_الشحنات.xlsx");
    }
</script>

</body>
</html>
