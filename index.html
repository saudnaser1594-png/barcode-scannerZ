<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>
  
  <!-- مكتبة قراءة الباركود -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- مكتبة استخراج النصوص والأرقام من الصور (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* خلفية الصفحة باللون الأصفر */
    body {
      background-color: #ffc107;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    /* الكارت الداخلي بنفس تصميم الصورة */
    .card {
      width: 100%;
      max-width: 400px;
      background: #fffbe6; /* أصفر فاتح جداً هادئ */
      border-radius: 20px;
      border: 2px solid #0056b3;
      padding: 20px 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* عنوان الشركة في الأعلى باللون الأزرق */
    .company-title {
      color: #0056b3;
      text-align: center;
      margin: 0 0 15px 0;
      font-size: 1.3rem;
      font-weight: bold;
      direction: ltr;
    }

    /* إطار الكاميرا لقراءة الباركود */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0056b3;
      background-color: #000000;
      margin-bottom: 15px;
    }

    /* صندوق اختيار ملف (الصورة) */
    .file-input-container {
      background: #ffffff;
      border: 2px solid #0056b3;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .file-input-container label {
      display: block;
      color: #0056b3; /* العبارة باللون الأزرق */
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    input[type="file"] {
      width: 100%;
      color: #0056b3; /* نص اسم الملف باللون الأزرق */
      font-size: 0.9rem;
      cursor: pointer;
    }

    .status-msg {
      color: #0056b3;
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
      font-weight: bold;
    }

    /* عداد الشحنات المسجلة */
    .counter-box {
      background-color: #fffbe6;
      border: 2px solid #0056b3;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
