<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zajil Express Trading Company</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0f2f5;
            font-family: Arial, Tahoma, sans-serif;
            padding: 20px 12px;
            color: #111;
        }

        .card {
            max-width: 420px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px 22px 35px;
            text-align: center;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin: 0 auto 18px;
            border-radius: 22px;
        }

        .company-name {
            color: #003b73;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
            line-height: 1.3;
        }

        .scanner-title {
            font-size: 24px;
            font-weight: 700;
            color: #111;
            margin-bottom: 28px;
        }

        .btn-main {
            background: #087ff5;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        #reader {
            width: 100%;
            margin-bottom: 20px;
            display: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .upload-title {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .file-box {
            border: 1.5px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .file-box input[type="file"] {
            width: 100%;
            font-size: 15px;
        }

        .info {
            font-size: 14px;
            color: #777;
            line-height: 1.6;
            margin: 20px 0 25px;
        }

        hr {
            border: none;
            border-top: 1px solid #eee;
            margin: 25px 0;
        }

        .counter {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-delete {
            flex: 1;
            padding: 13px 8px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #fff;
        }

        .btn-clear {
            color: #e74c3c;
            border: 1.5px solid #e74c3c;
        }

        .btn-last {
            color: #333;
            border: 1.5px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 6px;
            text-align: center;
            font-size: 15px;
        }

        th {
            background: #005baa;
            color: white;
        }

        .awb {
            direction: ltr;
            font-weight: bold;
            color: #005baa;
        }

        #status {
            display: none;
            padding: 12px;
            margin: 15px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
        }

        .success {
            background: #e8f7ee;
            color: #198754;
        }

        .error {
            background: #fdeaea;
            color: #dc3545;
        }
    </style>
</head>
