<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      color: #003399;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .text-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #003399;
      border-radius: 8px;
      font-size: 1rem;
      direction: ltr;
      text-align: center;
    }

    .file-input-container {
      background: #fffdf2;
      border: 2px dashed #003399;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .file-label {
      display: block;
      color: #003399;
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    /* مدخل اختيار الملف ظاهر ويعمل مباشرة */
    .file-input-field {
      width: 100%;
      padding: 8px;
      background: #ffffff;
      border: 1px solid #003399;
      border-radius: 6px;
      cursor: pointer;
    }

    .status-msg {
      color: #003399;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
      font-weight: bold;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 150px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <div class="input-group">
    <label for="barcodeInput">إدخال / مسح رقم الشحنة (AWBNUMBER):</label>
    <input type="text" id="barcodeInput" class="text-input" placeholder="امسح أو اكتب الرقم هنا..." autofocus onkeydown="checkEnter(event)">
  </div>

  <button class="btn-action" onclick="addShipment()">إضافة الشحنة للقائمة</button>

  <div class="file-input-container">
    <span class="file-label">📁 اختيار ملف:</span>
    <input type="file" id="attachedFile" class="file-input-field" accept="image/*" onchange="processFileImage(event)">
    <div id="status" class="status-msg">جاري معالجة الملف...</div>
  </div>

  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToCSV()">تصدير Excel (CSV)</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];

  function addShipment() {
    const input = document.getElementById('barcodeInput');
    const val = input.value.trim();

    if (val && !shipments.includes(val)) {
      shipments.push(val);
      input.value = '';
      updateUI();
    }
    input.focus();
  }

  function checkEnter(e) {
    if (e.key === 'Enter') {
      addShipment();
    }
  }

  // قراءة الأرقام من الصورة مباشرة وتوجيهها للقائمة
  async function processFileImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.innerText = 'جاري تحليل الصورة واستخراج أرقام الشحنات...';

    try {
      if (typeof Tesseract !== 'undefined') {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const lines = ret.data.text.split('\n');
        let countAdded = 0;

        lines.forEach(line => {
          // استخراج أرقام الشحنات المتسلسلة
          const matches = line.match(/\b\d{6,20}(-\d+)*\b/g);
          if (matches) {
            matches.forEach(code => {
              if (!shipments.includes(code)) {
                shipments.push(code);
                countAdded++;
              }
            });
          }
        });

        statusEl.innerText = countAdded > 0 ? `تم إضافة ${countAdded} شحنة بنجاح!` : 'لم يتم العثور على أرقام شحنات بالصورة.';
      } else {
        // إذا تعذر تحميل المكتبة يتم إضافة اسم الملف أو التنبيه
        statusEl.innerText = 'تم رفع الملف بنجاح.';
      }
      updateUI();
    } catch (err) {
      statusEl.innerText = 'حدث خطأ أثناء قراءة الملف.';
    }
  }

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToCSV() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,AWBNUMBER\n" + shipments.join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Shipments.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      document.getElementById('status').style.display = 'none';
      updateUI();
    }
  }
</script>

</body>
</html>
