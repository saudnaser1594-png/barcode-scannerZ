<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Zajil Express Trading Company</title>
    
    <!-- مكتبة مسح الباركود للكاميرا -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- مكتبة ZXing للقراءة العامّة -->
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <!-- مكتبة QuaggaJS المخصصة للباركود الخطي الصعب -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <!-- مكتبة تصدير Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; background: #eef2f5; margin: 0; padding: 20px; }
        .card { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border-top: 8px solid #ffcc00; }
        
        button, input[type="file"] { margin: 8px 0; padding: 12px 15px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #reader { width: 100%; margin-top: 15px; display: none; border: 2px dashed #003399; overflow: hidden; border-radius: 8px; }
        #reader video { width: 100% !important; height: auto !important; object-fit: cover; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; }
        th { background: #003399 !important; color: #ffffff !important; padding: 10px; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 15px; }
        hr { border: 0; height: 1px; background: #e0e0e0; margin: 20px 0; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-delete:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="color: #003399 !important; margin-bottom: 5px; font-weight: 800;">Zajil Express Trading Company</h2>
        <h2 style="color: #003399 !important; margin-top: 0; font-size: 18px;">Scan Barcode Shipment</h2>
    
        <button style="background: #003399 !important; color: white !important; border: none; width: 100%; font-weight: bold;" onclick="startCamera()">📷 تشغيل الكاميرا للتصوير</button>
        <div id="reader"></div>

        <hr>

        <label for="qr-input-file"><b style="color: #003399;">أو اختر صورة من الجهاز:</b></label><br>
        <input type="file" id="qr-input-file" accept="image/*">

        <hr>

        <h3 style="color: #003399;">قائمة الشحنات (<span id="count" style="color: #ffcc00; font-size: 22px;">0</span>)</h3>
        <table id="shipments-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>AWBNUMBER</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <br>
        <button style="background: #ffcc00 !important; color: #003399 !important; border: none; width: 100%; font-weight: bold;" onclick="exportToExcel()">📥 تحميل ملف Excel</button>
    </div>

<script>
    let shipments = [];
    let html5QrCode;

    window.addEventListener('DOMContentLoaded', () => {
        if (typeof Html5Qrcode !== 'undefined') {
            html5QrCode = new Html5Qrcode("reader");
        }
    });

    function isPhoneNumber(rawText) {
        if (!rawText) return true;
        const digitsOnly = rawText.trim().replace(/\D/g, '');
        if (digitsOnly.length === 10 && digitsOnly.startsWith('05')) return true;
        if ((digitsOnly.length === 12 || digitsOnly.length === 13 || digitsOnly.length === 14) && /^(9665|009665)/.test(digitsOnly)) return true;
        if (/(\+?9665|05\d{8})/i.test(rawText)) return true;
        return false;
    }

    function addShipmentCode(codeText) {
        const cleanText = codeText.trim();
        if (isPhoneNumber(cleanText)) return false;

        if (!shipments.includes(cleanText)) {
            shipments.push(cleanText);
            updateTable();
            return true;
        }
        return false;
    }

    function removeShipment(index) {
        shipments.splice(index, 1);
        updateTable();
    }

    function updateTable() {
        const tbody = document.getElementById("table-body");
        tbody.innerHTML = "";
        shipments.forEach((num, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${num}</b></td>
                    <td><button class="btn-delete" onclick="removeShipment(${index})">حذف 🗑️</button></td>
                </tr>`;
        });
        document.getElementById("count").innerText = shipments.length;
    }

    // تشغيل الكاميرا بجودة فائقة Full HD وميزة التركيز التلقائي
    async function startCamera() {
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        document.getElementById("reader").style.display = "block";

        const cameraConfig = {
            fps: 30,
            qrbox: (viewfinderWidth, viewfinderHeight) => {
                const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                return {
                    width: Math.floor(minEdge * 0.85),
                    height: Math.floor(minEdge * 0.5)
                };
            },
            videoConstraints: {
                facingMode: { exact: "environment" },
                width: { min: 1024, ideal: 1920, max: 3840 },
                height: { min: 720, ideal: 1080, max: 2160 },
                focusMode: { ideal: "continuous" },
                advanced: [{ focusMode: "continuous" }]
            }
        };

        try {
            await html5QrCode.start(
                { facingMode: "environment" },
                cameraConfig,
                (decodedText) => {
                    if (addShipmentCode(decodedText)) {
                        alert("تم مسح رقم الشحنة بنجاح: " + decodedText);
                        html5QrCode.stop();
                        document.getElementById("reader").style.display = "none";
                    }
                },
                () => {}
            );
        } catch (err) {
            // كود الاحتياط في حال عدم دعم بعض أجهزة الجوال للإعدادات المتقدمة
            await html5QrCode.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 300, height: 160 } },
                (decodedText) => {
                    if (addShipmentCode(decodedText)) {
                        alert("تم مسح رقم الشحنة بنجاح: " + decodedText);
                        html5QrCode.stop();
                        document.getElementById("reader").style.display = "none";
                    }
                }
            );
        }
    }

    function scanWithQuagga(srcUrl) {
        return new Promise((resolve) => {
            Quagga.decodeSingle({
                src: srcUrl,
                numOfWorkers: 0,
                inputStream: { size: 1280 },
                decoder: {
                    readers: ["code_128_reader", "ean_reader", "code_39_reader", "upc_reader"]
                }
            }, function(result) {
                if (result && result.codeResult && result.codeResult.code) {
                    resolve(result.codeResult.code);
                } else {
                    resolve(null);
                }
            });
        });
    }

    async function scanFileUltimate(imageFile) {
        let resultsFound = [];
        const fileUrl = URL.createObjectURL(imageFile);

        try {
            // 1. استخدام QuaggaJS
            const quaggaRes = await scanWithQuagga(fileUrl);
            if (quaggaRes) {
                resultsFound.push(quaggaRes);
                return resultsFound;
            }

            // 2. استخدام Html5Qrcode
            try {
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                const res = await html5QrCode.scanFile(imageFile, true);
                if (res) resultsFound.push(res);
            } catch (e) {}

            if (resultsFound.length > 0) return resultsFound;

            // 3. استخدام ZXing Direct
            const codeReader = new ZXing.BrowserMultiFormatReader();
            const imgElement = document.createElement('img');
            imgElement.src = fileUrl;
            await new Promise(r => imgElement.onload = r);

            try {
                const zxingRes = await codeReader.decodeMultipleFromImageElement(imgElement);
                zxingRes.forEach(r => resultsFound.push(r.text));
            } catch (e) {
                try {
                    const singleRes = await codeReader.decodeFromImageElement(imgElement);
                    resultsFound.push(singleRes.text);
                } catch (err) {}
            }

            if (resultsFound.length > 0) {
                codeReader.reset();
                return resultsFound;
            }

            // 4. تدوير الصورة ومعالجتها
            const angles = [90, 180, 270];
            for (let angle of angles) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                if (angle === 90 || angle === 270) {
                    canvas.width = imgElement.naturalHeight;
                    canvas.height = imgElement.naturalWidth;
                } else {
                    canvas.width = imgElement.naturalWidth;
                    canvas.height = imgElement.naturalHeight;
                }

                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate((angle * Math.PI) / 180);
                ctx.drawImage(imgElement, -imgElement.naturalWidth / 2, -imgElement.naturalHeight / 2);

                const rotatedDataUrl = canvas.toDataURL('image/jpeg', 0.9);

                const qRot = await scanWithQuagga(rotatedDataUrl);
                if (qRot) {
                    resultsFound.push(qRot);
                    break;
                }
            }
            codeReader.reset();
        } finally {
            URL.revokeObjectURL(fileUrl);
        }

        return resultsFound;
    }

    document.getElementById('qr-input-file').addEventListener('change', async e => {
        if (e.target.files.length === 0) return;
        const imageFile = e.target.files[0];
        
        const scannedTexts = await scanFileUltimate(imageFile);
        let addedAny = false;

        for (let text of scannedTexts) {
            if (addShipmentCode(text)) {
                addedAny = true;
            }
        }

        if (addedAny) {
            alert("تم استخراج رقم الشحنة بنجاح من الصورة!");
        } else if (scannedTexts.length > 0) {
            alert("الباركود المقروء هو رقم جوال وتم استبعاده تلقائياً.");
        } else {
            alert("تعذر قراءة الباركود، يرجى التأكد من اختيار صورة واضحة.");
        }
        
        e.target.value = '';
    });

    function exportToExcel() {
        if (shipments.length === 0) {
            alert("لا توجد شحنات لتصديرها!");
            return;
        }
        
        const data = shipments.map(num => ({ "AWBNUMBER": num }));
        const worksheet = XLSX.utils.json_to_sheet(data);
        worksheet['!cols'] = [{ wch: 25 }];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "SaleRent Details");
        XLSX.writeFile(workbook, "Shipments.xlsx");
    }
</script>

</body>
</html>
