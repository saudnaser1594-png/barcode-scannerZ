<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <!-- مكتبات القراءة والمسح الضوئي -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    /* منطقة الكاميرا للمسح المباشر */
    #reader {
      width: 100%;
      min-height: 200px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #003399;
      background-color: #000;
      margin-bottom: 15px;
    }

    .file-btn {
      display: block;
      width: 100%;
      background-color: #fffdf2;
      color: #003399;
      border: 2px dashed #003399;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      text-align: center;
    }

    .status-msg {
      color: #003399;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: none;
      font-weight: bold;
      text-align: center;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 150px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <!-- 1. الكاميرا المباشرة بدلاً من كتابة الرقم -->
  <div id="reader"></div>

  <!-- 2. اختيار صورة وحظر أرقام الجوال -->
  <label class="file-btn">
    📷 / 📁 اختيار ملف (صورة الشحنة)
    <input type="file" id="attachedFile" accept="image/*" style="display: none;" onchange="processImageFile(event)">
  </label>

  <div id="status" class="status-msg">جاري المعالجة...</div>

  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToExcel()">تصدير Excel (CSV)</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];
  let html5QrCode;

  // تشغيل الكاميرا التلقائي عند فتح الصفحة
  window.onload = function() {
    if (typeof Html5Qrcode !== 'undefined') {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          // التحقق أن الممسوح ليس رقم جوال
          if (decodedText && isShipmentNumber(decodedText)) {
            addShipmentToList(decodedText);
          }
        },
        () => {}
      ).catch(err => {
        console.log("الكاميرا تحتاج إذن التشغيل");
      });
    }
  };

  // فحص واستبعاد أرقام الجوال (التي تبدأ بـ 05 أو 9665 أو طولها 10 أرقام وتبدأ بـ 05)
  function isShipmentNumber(numStr) {
    const cleanNum = numStr.trim().replace(/\s+/g, '');
    
    // استبعاد أرقام الهواتف السعودية
    if (/^(05|9665|\+9665)/.test(cleanNum)) {
      return false;
    }
    return true;
  }

  // قراءة الصور وتصفية أرقام الجوال منها
  async function processImageFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.innerText = 'جاري تحليل الصورة وقراءة رقم الشحنة...';

    try {
      if (typeof Tesseract !== 'undefined') {
        const worker = await Tesseract.createWorker('eng');
        const ret = await worker.recognize(file);
        await worker.terminate();

        const extractedNumbers = ret.data.text.match(/\b\d{7,20}(-\d+)*\b/g);
        let addedCount = 0;

        if (extractedNumbers) {
          extractedNumbers.forEach(num => {
            if (isShipmentNumber(num)) {
              if (addShipmentToList(num)) {
                addedCount++;
              }
            }
          });
        }

        if (addedCount > 0) {
          statusEl.innerText = `تم استخراج ${addedCount} رقم شحنة (تم استبعاد أرقام الجوال)!`;
        } else {
          statusEl.innerText = 'لم يتم العثور على رقم شحنة صالح بالصورة.';
        }
      }
    } catch (e) {
      statusEl.innerText = 'حدث خطأ أثناء معالجة الصورة.';
    }
  }

  function addShipmentToList(code) {
    if (code && !shipments.includes(code)) {
      shipments.push(code);
      updateUI();
      return true;
    }
    return false;
  }

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToExcel() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,AWBNUMBER\n" + shipments.join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Shipments.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      document.getElementById('status').style.display = 'none';
      updateUI();
    }
  }
</script>

</body>
</html>
