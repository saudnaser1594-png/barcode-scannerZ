<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>
  
  <!-- مكتبة قراءة الباركود -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- مكتبة استخراج النصوص والأرقام من الصور (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- مكتبة إنشاء ملفات Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* خلفية الصفحة باللون الأصفر */
    body {
      background-color: #ffc107;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    /* الكارت الداخلي بنفس تصميم الصورة */
    .card {
      width: 100%;
      max-width: 400px;
      background: #fffbe6; /* أصفر فاتح جداً هادئ */
      border-radius: 20px;
      border: 2px solid #0056b3;
      padding: 20px 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* عنوان الشركة في الأعلى باللون الأزرق */
    .company-title {
      color: #0056b3;
      text-align: center;
      margin: 0 0 15px 0;
      font-size: 1.3rem;
      font-weight: bold;
      direction: ltr;
    }

    /* إطار الكاميرا لقراءة الباركود */
    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #0056b3;
      background-color: #000000;
      margin-bottom: 15px;
    }

    /* صندوق اختيار ملف (الصورة) */
    .file-input-container {
      background: #ffffff;
      border: 2px solid #0056b3;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
    }

    .file-input-container label {
      display: block;
      color: #0056b3; /* العبارة باللون الأزرق */
      font-weight: bold;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    input[type="file"] {
      width: 100%;
      color: #0056b3; /* نص اسم الملف باللون الأزرق */
      font-size: 0.9rem;
      cursor: pointer;
    }

    .status-msg {
      color: #0056b3;
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
      font-weight: bold;
    }

    /* عداد الشحنات المسجلة */
    .counter-box {
      background-color: #fffbe6;
      border: 2px solid #0056b3;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #0056b3; /* العبارة والأرقام باللون الأزرق */
      margin-bottom: 15px;
    }

    /* قائمة عرض أرقام الشحنات */
    .list-box {
      max-height: 150px;
      overflow-y: auto;
      background: #ffffff;
      border: 2px solid #0056b3;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 6px 10px;
      border-bottom: 1px solid #ffe082;
      font-size: 0.9rem;
      color: #0056b3; /* الأرقام باللون الأزرق */
      font-weight: 600;
      font-family: monospace;
      text-align: center;
    }

    /* الأزرار باللون الأزرق والنص أصفر */
    .btn-action {
      width: 100%;
      background-color: #0056b3;
      color: #ffc107;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: #003d80;
    }

    .btn-clear {
      background-color: #d9534f;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- العنوان العلوي -->
  <h2 class="company-title">Al Zajel Express Trading Company</h2>

  <!-- نافذة ماسح الباركود -->
  <div id="reader"></div>

  <!-- صندوق تحميل الملفات والصور -->
  <div class="file-input-container">
    <label for="imageFile">تحميل ملف شحنات (Image):</label>
    <input type="file" id="imageFile" accept="image/*" onchange="processImage(event)">
    <div id="status" class="status-msg">جاري قراءة أرقام الشحنات...</div>
  </div>

  <!-- عداد الشحنات -->
  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <!-- قائمة الشحنات المسجلة -->
  <div class="list-box" id="scannedList"></div>

  <!-- أزرار التحكم -->
  <button class="btn-action" onclick="exportToExcel()">تصدير الملف بصيغة Excel</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];
  let html5QrCode;

  function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 140 } },
      (decodedText) => {
        if (decodedText && !shipments.includes(decodedText)) {
          shipments.push(decodedText);
          updateUI();
        }
      },
      (errorMessage) => {}
    );
  }

  async function processImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    statusEl.innerText = 'جاري تحليل الصورة وقراءة الشحنات...';

    try {
      const worker = await Tesseract.createWorker('eng');
      const ret = await worker.recognize(file);
      await worker.terminate();

      const lines = ret.data.text.split('\n');
      let countAdded = 0;

      lines.forEach(line => {
        const cleaned = line.trim().replace(/\s+/g, '');
        if (cleaned.length >= 10 && /\d{10}/.test(cleaned)) {
          if (!shipments.includes(cleaned)) {
            shipments.push(cleaned);
            countAdded++;
          }
        }
      });

      statusEl.innerText = countAdded > 0 ? `تم إضافة ${countAdded} شحنة بنجاح!` : 'لم يتم العثور على أرقام جديدة.';
      updateUI();
    } catch (err) {
      statusEl.innerText = 'حدث خطأ أثناء قراءة الملف.';
    }
  }

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToExcel() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    const excelData = shipments.map(code => ({ "AWBNUMBER": code }));
    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "SaleRent Details");

    XLSX.writeFile(workbook, "Shipments_List.xlsx");
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      document.getElementById('status').style.display = 'none';
      updateUI();
    }
  }

  window.onload = startScanner;
</script>

</body>
</html>
