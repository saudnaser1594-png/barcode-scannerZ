<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    .input-group {
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      color: #003399;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .text-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #003399;
      border-radius: 8px;
      font-size: 1rem;
      direction: ltr;
      text-align: center;
    }

    .file-input-container {
      background: #fffdf2;
      border: 2px dashed #003399;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
    }

    .custom-file-upload {
      display: block;
      width: 100%;
      padding: 10px;
      color: #003399;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.95rem;
    }

    input[type="file"] {
      display: none;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 150px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <div class="input-group">
    <label for="barcodeInput">إدخال / مسح رقم الشحنة (AWBNUMBER):</label>
    <input type="text" id="barcodeInput" class="text-input" placeholder="امسح أو اكتب الرقم هنا..." autofocus onkeydown="checkEnter(event)">
  </div>

  <button class="btn-action" onclick="addShipment()">إضافة الشحنة للقائمة</button>

  <div class="file-input-container">
    <label for="attachedFile" class="custom-file-upload">
      📁 اختيار ملف
    </label>
    <input type="file" id="attachedFile" onchange="handleFileUpload(event)">
  </div>

  <div class="counter-box">
    عدد الشحنات المسجلة: <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToCSV()">تصدير Excel (CSV)</button>
  <button class="btn-action btn-clear" onclick="clearList()">مسح القائمة</button>
</div>

<script>
  let shipments = [];

  function addShipment() {
    const input = document.getElementById('barcodeInput');
    const val = input.value.trim();

    if (val && !shipments.includes(val)) {
      shipments.push(val);
      input.value = '';
      updateUI();
    }
    input.focus();
  }

  function checkEnter(e) {
    if (e.key === 'Enter') {
      addShipment();
    }
  }

  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (file) {
      alert(`تم اختيار الملف: ${file.name}`);
    }
  }

  function updateUI() {
    document.getElementById('count').innerText = shipments.length;
    const listContainer = document.getElementById('scannedList');
    listContainer.innerHTML = shipments.map(code => `<div class="list-item">${code}</div>`).join('');
    listContainer.scrollTop = listContainer.scrollHeight;
  }

  function exportToCSV() {
    if (shipments.length === 0) {
      alert("لا توجد شحنات مسجلة للتصدير");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,AWBNUMBER\n" + shipments.join("\n");
    let encodedUri = encodeURI(csvContent);
    let link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Shipments.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearList() {
    if (confirm("هل تريد مسح جميع الشحنات المسجلة؟")) {
      shipments = [];
      updateUI();
    }
  }
</script>

</body>
</html>
