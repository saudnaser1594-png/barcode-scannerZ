<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Zajel Express Trading Company</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      direction: rtl;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background-color: #ffffff;
      border-radius: 16px;
      border: 2px solid #003399;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header-banner {
      background-color: #ffc20e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      text-align: center;
      border: 1px solid #e0a800;
    }

    .company-title {
      color: #003399;
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      direction: ltr;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      color: #003399;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .text-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #003399;
      border-radius: 8px;
      font-size: 1rem;
      direction: ltr;
      text-align: center;
    }

    .counter-box {
      background-color: #ffc20e;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      color: #003399;
      margin-bottom: 12px;
      border: 1px solid #003399;
    }

    .list-box {
      max-height: 150px;
      min-height: 80px;
      overflow-y: auto;
      background: #f8f9fa;
      border: 1px solid #003399;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 15px;
    }

    .list-item {
      padding: 8px;
      background-color: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 0.95rem;
      color: #003399;
      font-weight: bold;
      font-family: monospace;
      text-align: center;
    }

    .btn-action {
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .btn-clear {
      background-color: #dc2626;
      color: #ffffff;
    }

    /* زر اختيار الملف */
    .file-label {
      display: block;
      width: 100%;
      background-color: #003399;
      color: #ffc20e;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .file-label:hover {
      opacity: 0.9;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header-banner">
    <h2 class="company-title">Al Zajel Express Trading Company</h2>
  </div>

  <div class="input-group">
    <label for="barcodeInput">
      إدخال / مسح رقم الشحنة (AWBNUMBER):
    </label>

    <input
      type="text"
      id="barcodeInput"
      class="text-input"
      placeholder="امسح أو اكتب الرقم هنا..."
      autofocus
      onkeydown="checkEnter(event)"
    >
  </div>

  <button class="btn-action" onclick="addShipment()">
    إضافة الشحنة للقائمة
  </button>

  <!-- اختيار ملف -->
  <label for="fileInput" class="file-label">
    اختيار ملف
  </label>

  <input
    type="file"
    id="fileInput"
    accept=".csv,.txt"
    onchange="importFile(event)"
  >

  <div class="counter-box">
    عدد الشحنات المسجلة:
    <span id="count">0</span>
  </div>

  <div class="list-box" id="scannedList"></div>

  <button class="btn-action" onclick="exportToCSV()">
    تصدير Excel (CSV)
  </button>

  <button class="btn-action btn-clear" onclick="clearList()">
    مسح القائمة
  </button>

</div>

<script>

  let shipments = [];

  // إضافة شحنة واحدة
  function addShipment() {

    const input = document.getElementById('barcodeInput');
    const val = input.value.trim();

    if (val && !shipments.includes(val)) {

      shipments.push(val);

      input.value = '';

      updateUI();
    }

    input.focus();
  }


  // الضغط على Enter
  function checkEnter(e) {

    if (e.key === 'Enter') {
      e.preventDefault();
      addShipment();
    }

  }


  // تحديث القائمة
  function updateUI() {

    document.getElementById('count').innerText = shipments.length;

    const listContainer =
      document.getElementById('scannedList');

    listContainer.innerHTML =
      shipments.map(code =>
        `<div class="list-item">${escapeHTML(code)}</div>`
      ).join('');

    listContainer.scrollTop =
      listContainer.scrollHeight;
  }


  // قراءة الملف
  function importFile(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      const text = e.target.result;

      // تقسيم الملف إلى أسطر
      const lines = text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line !== '');

      let added = 0;

      lines.forEach(line => {

        // أخذ أول قيمة في السطر إذا كان CSV
        const value = line
          .split(',')[0]
          .replace(/"/g, '')
          .trim();

        // تجاهل عنوان العمود
        if (
          value &&
          value.toUpperCase() !== 'AWBNUMBER' &&
          !shipments.includes(value)
        ) {

          shipments.push(value);
          added++;

        }

      });

      updateUI();

      alert(
        `تمت إضافة ${added} شحنة من الملف`
      );

      // إعادة ضبط اختيار الملف
      event.target.value = '';
    };

    reader.readAsText(file);

  }


  // تصدير CSV
  function exportToCSV() {

    if (shipments.length === 0) {

      alert("لا توجد شحنات مسجلة للتصدير");

      return;
    }

    let csvContent =
      "data:text/csv;charset=utf-8,\uFEFFAWBNUMBER\n" +
      shipments.join("\n");

    let encodedUri =
      encodeURI(csvContent);

    let link =
      document.createElement("a");

    link.setAttribute(
      "href",
      encodedUri
    );

    link.setAttribute(
      "download",
      "Shipments.csv"
    );

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);
  }


  // مسح القائمة
  function clearList() {

    if (
      confirm(
        "هل تريد مسح جميع الشحنات المسجلة؟"
      )
    ) {

      shipments = [];

      updateUI();

    }

  }


  // حماية عرض النص
  function escapeHTML(text) {

    const div =
      document.createElement('div');

    div.textContent = text;

    return div.innerHTML;
  }

</script>

</body>
</html>
